          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Forum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/{id}/topics:
    get:
      operationId: listForumTopics
      summary: List topics in a forum
      description: >
        Pinned topics first, then by most recent activity. The response repeats the forum itself so a client can render a header without a second request, and carries `can_create_topic` — posting has its own level threshold (`min_post_level`), which can be higher than the one needed to read.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: A page of topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  forum:
                    $ref: '#/components/schemas/Forum'
                  topics:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumTopic'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                    description: >
                      The page actually served, after a non-positive or unparseable value is resolved to 1.

                  per_page:
                    type: integer
                    description: >
                      The page size actually used, after the cap of 100 and the default of 25 are applied.

                  can_create_topic:
                    type: boolean
                    description: >
                      Whether the caller may open a topic here. Answers the same question the create call does: the group level must reach the forum's `min_post_level` **and** the member's own forum privilege must not be revoked. False for an anonymous caller.

        '400':
          description: Invalid forum ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Forum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createForumTopic
      summary: Start a topic
      description: >
        Creates the topic and its first post in one call, and returns both. The first post cannot be deleted on its own — deleting the topic is what removes it.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForumTopicRequest'
      responses:
        '201':
          description: >
            The new topic and its first post, re-read after the insert so both carry the same fully populated shape any other endpoint returns — the byline fields (`username`, `forum_name`, `group_name`, `avatar`, `user_created_at`, `user_post_count`) are set, and `is_first_post` is `true` on the post that opens the topic.

          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    $ref: '#/components/schemas/ForumTopic'
                  post:
                    $ref: '#/components/schemas/ForumPost'
        '400':
          description: >
            Invalid forum ID, unparseable body, an empty title or body, or a title longer than 200 runes

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller's group level is below the forum's `min_post_level`, they cannot read the forum at all, or their forum privilege has been revoked (`can_forum`) — the last of these is the common case in practice and is not reflected in `can_create_topic`

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Forum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}:
    get:
      operationId: getForumTopic
      summary: Get a topic and a page of its posts
      description: >
        Reading a topic increments its view count.

        Soft-deleted posts are still returned, with `is_deleted` true — a gap in the numbering would be more confusing than a placeholder. Their `body` and `mentioned_usernames` are blanked for anyone but staff, so a deleted post cannot be read through this endpoint by the member it was hidden from.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: The topic and one page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    $ref: '#/components/schemas/ForumTopic'
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumPost'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                    description: >
                      The page actually served, after a non-positive or unparseable value is resolved to 1.

                  per_page:
                    type: integer
                    description: >
                      The page size actually used, after the cap of 100 and the default of 25 are applied.

                  can_moderate:
                    type: boolean
                    description: >
                      True for staff who also pass the moderation hierarchy check — so it is not simply "is staff", and is false for a staff member outranked by the topic's author — and true for the topic's own author within the 30-minute grace period after creating it.

                      It is **not** a single permission. An author who holds it by the grace period may lock and delete but not pin, unpin or move, which are staff-only regardless. Renaming is separate again: the author may rename their own topic with no time limit, so `can_moderate: false` does not mean rename is refused. Tracked in #235.

        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The topic's forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteForumTopic
      summary: Delete a topic and every post in it
      description: >
        Published rather than internal because the author may delete their own topic within 30 minutes of creating it — a typo in a new thread does not need staff. After that window it is staff-only, and a staff member cannot delete a topic started by someone who outranks them.

        The optional `reason` is recorded in the activity log.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumModerationReason'
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author inside the grace period, not staff, or staff outranked by the topic's author

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}/posts:
    post:
      operationId: createForumPost
      summary: Reply to a topic
      description: >
        `@mentions` in the body notify the members named, and the usernames that resolved come back in `mentioned_usernames`.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForumPostRequest'
      responses:
        '201':
          description: The new post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/ForumPost'
        '400':
          description: >
            Invalid topic ID, unparseable body, an empty body, or a `reply_to_post_id` that is not a post in this topic

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The topic is locked and the caller is not staff, its forum is above the caller's level, or the caller's forum privilege has been revoked (`can_forum`) — the last of these is the common case in practice

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The topic, or the forum it belongs to, was not found — the message names which

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/posts/{id}:
    put:
      operationId: editForumPost
      summary: Edit a post
      description: >
        The author may edit their own post; staff may edit anyone's, and the optional `reason` is stored on the edit-history row for that case.

        An edit whose body is identical to the current one is a no-op: it returns **200** with the post unchanged, writes no history row, and does not move `edited_at`.

        Returns **409** only when another edit commits between *this request's* read of the post and its write — the comparison baseline is the body the server just read, not anything the client sent. This is **not** optimistic concurrency against the copy you are holding: there is no version, ETag or expected-body field to send, so a client editing from a body that is already stale overwrites the newer one and gets 200. Re-read the post immediately before submitting.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditForumPostRequest'
      responses:
        '200':
          description: The edited post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/ForumPost'
        '400':
          description: Invalid post ID, unparseable body, or an empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author and not staff; the caller's forum privilege has been revoked (`can_forum`); the topic is locked and the caller is not staff; or the post's forum is above the caller's group level

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The post, its topic, or the forum they belong to was not found — the message names which

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Another edit committed between this request's read and its write. Error code `edit_conflict`; reload and retry.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteForumPost
      summary: Delete a post
      description: >
        A soft delete: the post keeps its place in the topic marked `is_deleted`, and staff can still read it and restore it. The author may delete their own post; staff may delete anyone's.

        The first post of a topic cannot be deleted this way — delete the topic instead. That returns **400**, not 403: it is not a permission problem.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid post ID, or this is the topic's first post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author and not staff; the caller's forum privilege has been revoked (`can_forum`); the topic is locked and the caller is not staff; or the post's forum is above the caller's group level

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The post, its topic, or the forum they belong to was not found — the message names which

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}/lock:
    post:
      operationId: lockForumTopic
      summary: Lock a topic
      description: >
        A locked topic can still be read; replies are refused with 403.

        Published rather than internal for the same reason as deleting a topic: the author may lock their own topic within 30 minutes of creating it, without being staff. After that window it is staff-only and subject to the moderation hierarchy — a topic started by someone who outranks the caller cannot be locked by them.

        Unlocking is staff-only with no such allowance, so an author who locks their own thread cannot reopen it.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumModerationReason'
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumModerationResult'
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author inside the 30-minute grace period, not staff, or staff outranked by the topic's author. An author within the window is also refused if their forum privilege has been revoked (`can_forum`).

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}/title:
    put:
      operationId: renameForumTopic
      summary: Rename a topic
      description: >
        Published rather than internal because this is not staff-only: the topic's author may rename their own topic, with **no** time limit — unlike locking and deleting, which the author may only do within 30 minutes of creating the topic. Staff may rename anyone's, subject to the moderation hierarchy.

        An author cannot rename a locked topic; staff can. Note that `can_moderate` on the topic response does not describe this endpoint: it can be `false` while the author may still rename.

        The optional `reason` is recorded in the activity log.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameForumTopicRequest'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumModerationResult'
        '400':
          description: >
            Invalid topic ID, unparseable body, an empty title, or a title longer than 200 runes

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author and not staff; an author whose forum privilege has been revoked (`can_forum`) or whose topic is locked; or staff outranked by the topic's author

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}/subscribe:
    post:
      operationId: subscribeToForumTopic
      summary: Subscribe to a topic
      description: >
        Notifies the caller when someone replies. Subscribing re-checks forum access, so a subscription cannot be used to receive content from a forum the member has since lost access to.

      tags: [forums, notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumTopicSubscription'
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The topic's forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: unsubscribeFromForumTopic
      summary: Unsubscribe from a topic
      description: >
        Idempotent: unsubscribing when not subscribed succeeds. No forum access check — losing access must never leave a member unable to stop notifications.

      tags: [forums, notifications]
      security:
        - bearerAuth: []
