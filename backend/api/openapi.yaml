            schema:
              $ref: '#/components/schemas/RenameForumTopicRequest'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumModerationResult'
        '400':
          description: >
            Invalid topic ID, unparseable body, an empty title, or a title longer
            than 200 runes
          content:
            application/json:
              schema:
