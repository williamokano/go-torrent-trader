        '403':
          description: >
            The topic is locked and the caller is not staff, its forum is above the
            caller's level, or the caller's forum privilege has been revoked
            (`can_forum`) — the last of these is the common case in practice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The topic, or the forum it belongs to, was not found — the message names
            which
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/posts/{id}:
    put:
      operationId: editForumPost
      x-audience: public
      summary: Edit a post
      description: >
        The author may edit their own post; staff may edit anyone's, and the optional
        `reason` is stored on the edit-history row for that case.

        An edit whose body is identical to the current one is a no-op: it returns
        **200** with the post unchanged, writes no history row, and does not move
        `edited_at`.

        Returns **409** only when another edit commits between *this request's* read
        of the post and its write — the comparison baseline is the body the server
        just read, not anything the client sent. This is **not** optimistic
        concurrency against the copy you are holding: there is no version, ETag or
        expected-body field to send, so a client editing from a body that is already
        stale overwrites the newer one and gets 200. Re-read the post immediately
        before submitting.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditForumPostRequest'
      responses:
        '200':
          description: The edited post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/ForumPost'
        '400':
          description: Invalid post ID, unparseable body, or an empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author and not staff; the caller's forum privilege has been
            revoked (`can_forum`); the topic is locked and the caller is not staff;
            or the post's forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The post, its topic, or the forum they belong to was not found — the
            message names which
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Another edit committed between this request's read and its write. Error
            code `edit_conflict`; reload and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteForumPost
      x-audience: public
      summary: Delete a post
      description: >
        A soft delete: the post keeps its place in the topic marked `is_deleted`, and
        staff can still read it and restore it. The author may delete their own post;
        staff may delete anyone's.

        The first post of a topic cannot be deleted this way — delete the topic
        instead. That returns **400**, not 403: it is not a permission problem.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid post ID, or this is the topic's first post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author and not staff; the caller's forum privilege has been
            revoked (`can_forum`); the topic is locked and the caller is not staff;
            or the post's forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The post, its topic, or the forum they belong to was not found — the
            message names which
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/posts/{id}/restore:
    post:
      operationId: restoreForumPost
      x-audience: internal
      summary: Restore a soft-deleted post (staff only)
      description: >
        Undoes a delete. Staff-only, enforced in the service rather than by the
        route, which is why this is withheld from the published document despite
        sitting on an ordinary member path.

        Restoring a post that is not deleted is a **400** — the request describes a
        state that does not exist, rather than being refused.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Restored
        '400':
          description: Invalid post ID, or the post is not deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/posts/{id}/edits:
    get:
      operationId: listForumPostEdits
      x-audience: internal
      summary: A post's edit history (staff only)
      description: >
        Every revision of the post, **newest first**, each with the body before and
        after. Staff-only: the history includes bodies an author may since have
        removed, and the `reason` a staff editor recorded.

        The order is not cosmetic. Revisions are stored as reversible diffs rather
        than snapshots, and the bodies are reconstructed by walking backwards from
        the post's current text — so newest-first is the order the reconstruction
        produces. If a diff fails to replay, that revision and every older one carry
        `reconstruction_failed` with blank bodies.

        Withheld from the published document for the same reason as the restore
        endpoint — the gate is in the service, not the path.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post's revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  edits:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumPostEdit'
                    description: >
                      Newest first. An empty array for a post that has never been
                      edited, which is the common case for this endpoint.
        '400':
          description: Invalid post ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/topics/{id}/lock:
    post:
      operationId: lockForumTopic
      x-audience: public
      summary: Lock a topic
      description: >
        A locked topic can still be read; replies are refused with 403.

        Published rather than internal for the same reason as deleting a topic: the
        author may lock their own topic within 30 minutes of creating it, without
        being staff. After that window it is staff-only and subject to the moderation
        hierarchy — a topic started by someone who outranks the caller cannot be
        locked by them.

        Unlocking is staff-only with no such allowance, so an author who locks their
        own thread cannot reopen it.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
