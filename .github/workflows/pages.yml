name: Project site

# Publishes website/ to GitHub Pages on every change to the site.
#
# Pages is enabled with "GitHub Actions" as the source, and the project is MIT
# licensed, so the two things that previously held publication back are settled.
#
# The site lives at https://okano.dev/go-torrent-trader/ — the account has a
# verified custom domain, so this is NOT the github.io URL you might expect.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running publish — a half-deployed site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the pages exist
        # A typo in a path would otherwise publish a 404 with a green tick.
        run: |
          for page in index.html install.html configure.html assets/style.css assets/site.js; do
            test -f "website/$page" || { echo "::error::website/$page is missing"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
