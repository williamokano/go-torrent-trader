  /api/v1/forums/topics/{id}/title:
    put:
      operationId: renameForumTopic
      x-audience: public
      summary: Rename a topic
      description: >
        Published rather than internal because this is not staff-only: the topic's
        author may rename their own topic, with **no** time limit — unlike locking and
        deleting, which the author may only do within 30 minutes of creating the
        topic. Staff may rename anyone's, subject to the moderation hierarchy.

        An author cannot rename a locked topic; staff can. Note that
        `can_moderate` on the topic response does not describe this endpoint: it can
        be `false` while the author may still rename.

        The optional `reason` is recorded in the activity log.
      tags: [forums]
      security:
