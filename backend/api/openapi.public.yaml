        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Not subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumTopicSubscription'
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/topics/{id}/subscription:
    get:
      operationId: getForumTopicSubscription
      summary: Whether the caller is subscribed to a topic
      tags: [forums, notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The caller's subscription state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumTopicSubscription'
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token obtained from login or register
    passkeyAuth:
      type: apiKey
      in: query
      name: passkey
      description: >
        The member's 32-character hex passkey, carried in the query string. Used by the tracker and RSS endpoints, which are spoken to by BitTorrent clients and feed readers rather than by a browser holding a session. Regenerating the passkey (POST /api/v1/users/me/passkey) invalidates the old one immediately.

  parameters:
    StreamToken:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: >
        An access token, passed in the query string because EventSource cannot set an Authorization header.

  responses:
    AnnounceStream:
      description: An open server-sent event stream
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            retry: 5000

            event: announcement
            id: 42
            data: {"name":"Some.Torrent","url":"https://example.org/torrent/1"}
    StreamUnauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StreamForbidden:
      description: The caller does not hold the can_feed privilege
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StreamTooMany:
      description: The caller already holds the maximum number of concurrent streams
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          example: johndoe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          maxLength: 1024
          example: mysecurepassword
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          example: mysecurepassword
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: abc123def456...
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: 64-character hex token, expires in 1 hour
        refresh_token:
          type: string
          description: 64-character hex token, expires in 30 days
        expires_in:
          type: integer
          description: Seconds until access token expires
          example: 3600
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        email_confirmation_required:
          type: boolean
          description: >-
            Present and true on registration when the site requires email confirmation before the account can be used. Omitted otherwise, so treat absence as false.
    PublicProfile:
      type: object
      description: Profile visible to any authenticated user
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        group_id:
          type: integer
          format: int64
        avatar:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        info:
          type: string
          nullable: true
          description: User bio
        uploaded:
          type: integer
          format: int64
        downloaded:
          type: integer
          format: int64
        ratio:
          type: number
          format: double
          description: >
            uploaded / downloaded. Returns the sentinel -1 for an infinite ratio (downloaded=0 and uploaded>0), because JSON cannot encode Infinity and attempting it fails the whole response. Returns 0 when both are zero. Clients must translate -1 for display; the web UI's formatRatio and the CLI's output.Ratio both render it as "Inf".

        donor:
          type: boolean
        created_at:
          type: string
          format: date-time
    OwnerProfile:
      description: Extended profile visible only to the profile owner
      allOf:
        - $ref: '#/components/schemas/PublicProfile'
        - type: object
          properties:
            email:
              type: string
              format: email
            passkey:
              type: string
              description: >
                The member's full passkey, in the clear. It is returned only to the profile's owner, but it is NOT masked despite what this description claimed until 2026-07-26 — buildOwnerProfile returns the raw value. It is the tracker download credential embedded in every announce URL, so treat a response containing it as a secret: do not log it, and do not render it anywhere a screenshot or a CI transcript would capture it.

              example: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
            invites:
              type: integer
            warned:
              type: boolean
            last_login:
              type: string
              format: date-time
              nullable: true
    UserProfile:
      description: Deprecated - use PublicProfile or OwnerProfile instead
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        group_id:
          type: integer
          format: int64
        uploaded:
          type: integer
          format: int64
        downloaded:
          type: integer
          format: int64
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          description: Avatar URL (must be http or https)
          example: "https://example.com/avatar.png"
        title:
          type: string
          maxLength: 100
          description: Custom title
        info:
          type: string
          maxLength: 5000
          description: User bio
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The current password for verification
        new_password:
          type: string
          minLength: 8
          maxLength: 1024
          description: The new password
    AnnounceLogEntry:
      type: object
      description: >
        One announce, exactly as the client reported it. Retained for the window the response reports as `retention_days`, which may exceed the configured `announce_log_retention_days`.

      properties:
        id:
          type: integer
          format: int64
        torrent_id:
          type: integer
          format: int64
          nullable: true
          description: Null once the torrent has been deleted — the log outlives it
        torrent_name:
          type: string
          description: '"Deleted Torrent" when the torrent is gone'
        event:
          type: string
          enum: [started, stopped, completed, announce]
          description: '"announce" for a periodic update carrying no event'
        port:
          type: integer
          description: >
            The port the client listened on. There is no companion address: the tracker does not retain announce IPs.

        peer_id:
          type: string
          description: Hex-encoded — the raw value is arbitrary bytes
          example: "2d7142343535302d"
        uploaded:
          type: integer
          format: int64
          description: Client-reported cumulative total for the session
        downloaded:
          type: integer
          format: int64
          description: Client-reported cumulative total for the session
        left_bytes:
          type: integer
          format: int64
        uploaded_delta:
          type: integer
          format: int64
          description: Bytes uploaded since this peer's previous announce
        downloaded_delta:
          type: integer
          format: int64
          description: Raw, before any freeleech discount
        counted_downloaded_delta:
          type: integer
          format: int64
          description: After freeleech discount — what counted toward ratio
        seeder:
          type: boolean
        announced_at:
          type: string
          format: date-time
    AnnounceLogPeriod:
      type: object
      description: >
        One calendar month (UTC) of totals, aggregated from the raw log before it was pruned and kept permanently.

      properties:
        year_month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: "2026-07"
        uploaded:
          type: integer
          format: int64
          description: Sum of per-announce upload deltas for the month
        downloaded:
          type: integer
          format: int64
          description: Raw download total, before freeleech discounts
        counted_downloaded:
          type: integer
          format: int64
          description: What counted toward ratio for the month
        announces:
          type: integer
          format: int64
        seed_announces:
          type: integer
          format: int64
          description: How many of those announces were made while seeding
        ratio:
          type: number
          format: double
          description: >
            uploaded / counted_downloaded. 0 when the month is empty, -1 when nothing counted against the member (an effectively infinite ratio).

    AnnounceLogResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnnounceLogEntry'
        total:
          type: integer
          format: int64
          description: Total retained announces for this member
        page:
          type: integer
        per_page:
          type: integer
        monthly:
          type: array
          description: Monthly totals, newest month first, up to 120 months
          items:
            $ref: '#/components/schemas/AnnounceLogPeriod'
        retention_days:
          type: integer
          description: >
            How many days of raw announces the site keeps. 0 means pruning is disabled and nothing is deleted.

    Torrent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        info_hash:
          type: string
          description: Hex-encoded SHA1 info hash
          example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"
        size:
          type: integer
          format: int64
          description: Total size in bytes
        description:
          type: string
        category_id:
          type: integer
          format: int64
        category_name:
          type: string
          description: Name of the category (resolved via JOIN)
        category_image_url:
          type: string
          description: Icon for the category, resolved via the same JOIN. May be empty.
        uploader_id:
          type: integer
          format: int64
        anonymous:
          type: boolean
        uploader_name:
          type: string
          description: Display name of the uploader ("Anonymous" when anonymous=true)
        uploader_warned:
          type: boolean
          description: Whether the uploader has an active warning (false when anonymous=true)
        seeders:
          type: integer
        leechers:
          type: integer
        times_completed:
          type: integer
        comments_count:
          type: integer
        file_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HnRRecordView:
      type: object
      description: >
        One hit-and-run obligation as shown to the member who owns it. display_status is evaluated live on every request against the member's current class rule (see EvaluateHnRRecord) and the live peers overlay, so it can be ahead of state — never behind it — when the daemon has not yet run since something changed.

      properties:
        id:
          type: integer
          format: int64
        torrent_id:
          type: integer
          format: int64
        torrent_name:
          type: string
        torrent_size:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, hnr, satisfied, cleared, waived]
          description: The daemon-persisted state, as of its last run.
        display_status:
          type: string
          enum: [breach, monitoring, satisfied, cleared, waived]
          description: The live-evaluated status the page should actually show.
        completed_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        seeded_seconds:
          type: integer
          format: int64
        uploaded:
          type: integer
          format: int64
        breached_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        currently_seeding:
          type: boolean
          description: >
            True when the member has an active seeding peer for this torrent right now, straight from the peers table.

        required_seed_hours:
          type: integer
          nullable: true
          description: Omitted when the member's current class carries no rule.
        required_ratio:
          type: number
          format: double
          nullable: true
        inactivity_grace_hours:
          type: integer
          nullable: true
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
          nullable: true
        sort_order:
          type: integer
    SiteStats:
      type: object
      properties:
        users:
          type: integer
          format: int64
          description: Number of enabled users
        torrents:
          type: integer
          format: int64
          description: Number of visible, non-banned torrents
        peers:
          type: integer
          format: int64
          description: Number of active peers
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The raw reset token from the email link
          example: abc123def456...
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: The new password
          example: mynewsecurepassword
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully
    EditTorrentRequest:
      type: object
      properties:
        name:
          type: string
          description: New torrent name (must not be empty if provided)
        description:
          type: string
          description: New torrent description
        category_id:
          type: integer
          format: int64
          description: New category ID
        anonymous:
          type: boolean
          description: Whether the upload is anonymous
        banned:
          type: boolean
          description: Staff-only — ban/unban the torrent
        free:
          type: boolean
          description: Staff-only — enable/disable freeleech
        hnr_exempt:
          type: boolean
          description: >
            Staff-only — exempt this torrent from hit-and-run tracking. Waives any open obligation against it; un-exempting does not resurrect a waived one.

    DeleteTorrentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Reason for deleting the torrent
    CreateReportRequest:
      type: object
      required: [reason]
      properties:
        torrent_id:
          type: integer
          format: int64
          description: ID of the torrent being reported (optional for general reports)
        reason:
          type: string
          description: Reason for the report
    ForumCategory:
      type: object
      description: >
        A heading in the forum index with the forums under it. Forums above the caller's group level are omitted, and a category whose every forum is above their level is not returned at all — so `forums` is never empty.

      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sort_order:
          type: integer
        forums:
          type: array
          items:
            $ref: '#/components/schemas/Forum'
    Forum:
      type: object
      required: [id, category_id, name, description, sort_order, topic_count, post_count, min_group_level, min_post_level, created_at]
      properties:
        id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        topic_count:
          type: integer
        post_count:
          type: integer
        min_group_level:
          type: integer
          description: The group level needed to read this forum
        min_post_level:
          type: integer
          description: >
            The group level needed to post in it. Can be higher than `min_group_level`, which is how a read-only announcements forum is configured.

        created_at:
          type: string
          format: date-time
        last_post_at:
          type: string
          format: date-time
          description: Absent when the forum has never been posted in
        last_post_username:
          type: string
          description: Absent when the forum has never been posted in
        last_post_topic_id:
          type: integer
          format: int64
          description: Absent when the forum has never been posted in
        last_post_topic_title:
          type: string
          description: Absent when the forum has never been posted in
    ForumTopic:
      type: object
      required: [id, forum_id, user_id, username, title, pinned, locked, post_count, view_count, created_at, updated_at, forum_name]
      properties:
        id:
          type: integer
          format: int64
        forum_id:
          type: integer
          format: int64
        forum_name:
          type: string
        user_id:
          type: integer
          format: int64
          description: The member who started the topic
        username:
          type: string
        title:
          type: string
        pinned:
          type: boolean
        locked:
          type: boolean
          description: A locked topic can still be read; replies are refused
        post_count:
          type: integer
        view_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_post_at:
          type: string
          format: date-time
          description: >
            Points at the opening post from the moment the topic is created, so this is present on every topic — including one with no replies yet. It is not a "has replies" signal; compare `post_count` for that.

        last_post_username:
          type: string
          description: >
            Present on every topic, naming the author for a topic with no replies. Since the opening post cannot be soft-deleted, this always resolves.

    ForumPost:
      type: object
      required: [id, topic_id, user_id, username, avatar, group_name, body, mentioned_usernames, created_at, user_created_at, user_post_count, is_deleted, is_first_post]
      properties:
        id:
          type: integer
          format: int64
        topic_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
        avatar:
          type: string
          nullable: true
          description: Null when the member has not set one
        group_name:
          type: string
        body:
          type: string
          description: >
            Markdown. **Empty string** on a soft-deleted post for anyone but staff — the post keeps its place in the topic but its content is withheld.

        mentioned_usernames:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Members `@mentioned` in the body, as resolved when the post was last written **or edited** — an edit re-resolves them against the new body and replaces the stored list, so a mention removed by an edit disappears here. Empty array, not null, for a post with no mentions.

            Null on a soft-deleted post for anyone but staff: who a hidden post named is as much of a disclosure as what it said.

        created_at:
          type: string
          format: date-time
        user_created_at:
          type: string
          format: date-time
          description: When the post's author joined the site, for the post's byline
        user_post_count:
          type: integer
          description: The author's total post count, for the byline
        is_deleted:
          type: boolean
        is_first_post:
          type: boolean
          description: >
            True for the post that opens the topic. It cannot be deleted on its own — deleting the topic is what removes it.

        reply_to_post_id:
          type: integer
          format: int64
          description: Absent unless this post replies to a specific other post
        edited_at:
          type: string
          format: date-time
          description: Absent if never edited
        edited_by:
          type: integer
          format: int64
          description: >
            User ID of whoever last edited it — an id, not a username, so a client showing a name has to resolve it. Absent if never edited.

        deleted_at:
          type: string
          format: date-time
          description: Absent unless deleted
        deleted_by:
          type: integer
          format: int64
          description: >
            User ID of whoever deleted it. Present for staff only — a member is told their post was removed, not by whom.

    ForumSearchResult:
      type: object
      required: [post_id, body, topic_id, topic_title, forum_id, forum_name, user_id, username, created_at, snippet, post_number, page]
      properties:
        post_id:
          type: integer
          format: int64
        topic_id:
          type: integer
          format: int64
        topic_title:
          type: string
        forum_id:
          type: integer
          format: int64
        forum_name:
          type: string
        user_id:
          type: integer
          format: int64
        username:
          type: string
        body:
          type: string
          description: The full post body
        snippet:
          type: string
          description: >
            **HTML, not plain text.** The matched terms are wrapped in `<mark>` tags and every other character is escaped, so it is safe to render as markup and will show visible tags if rendered as text.

          example: "the <mark>seedbox</mark> guide everyone links to"
        created_at:
          type: string
          format: date-time
        post_number:
          type: integer
          description: The post's 1-based position within its topic
        page:
          type: integer
          description: >
            Which page of the topic `post_number` falls on at 25 posts per page, so a client can deep-link to the post rather than the top of the thread.

    ForumTopicSubscription:
      type: object
      properties:
        subscribed:
          type: boolean
    ForumModerationResult:
      type: object
      description: >
        What the topic moderation endpoints return. Deliberately not the updated topic: the client already knows what it asked for, and re-reading the topic is a separate request it may not need.

      properties:
        message:
          type: string
          example: topic locked
    ForumModerationReason:
      type: object
      description: >
        The optional note recorded in the activity log alongside a moderation action. The whole body is optional — an unparseable or absent body is treated as no reason rather than as an error, so a client that sends nothing still works.

      properties:
        reason:
          type: string
          maxLength: 500
          description: Truncated to 500 characters if longer
    CreateForumTopicRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 200
          description: >
            Trimmed of surrounding whitespace, then rejected if empty or longer than 200 runes.

        body:
          type: string
          description: Markdown, becomes the topic's first post
    CreateForumPostRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Markdown. `@mentions` notify the members named.
        reply_to_post_id:
          type: integer
          format: int64
          description: >
            Marks this post as a reply to another one in the same topic. A post from a different topic is rejected.

    EditForumPostRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
        reason:
          type: string
          maxLength: 500
          description: >
            Why the post was edited, stored on the edit-history row. Meant for a staff member editing someone else's post; truncated to 500 runes.

    RenameForumTopicRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: >
            Trimmed of surrounding whitespace, then rejected if empty or longer than 200 runes.

        reason:
          type: string
          maxLength: 500
          description: >
            Recorded in the activity log, truncated to 500 runes like every other moderation reason.

    Report:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reporter_id:
          type: integer
          format: int64
        torrent_id:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string
        resolved:
          type: boolean
        resolved_by:
          type: integer
          format: int64
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Comment text
          example: "Great torrent, thanks!"
    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        torrent_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RateRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1 to 5
          example: 4
    RatingStats:
      type: object
      properties:
        average:
          type: number
          format: double
          description: Average rating (0 if no ratings)
        count:
          type: integer
          description: Total number of ratings
        user_rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The authenticated user's rating (omitted if not rated)
    ModerationMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: The message to add to the moderation thread
    ModerationMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        torrent_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_username:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
