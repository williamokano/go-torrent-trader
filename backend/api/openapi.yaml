          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Report management. Previously documented as GET /api/v1/reports and
  # PUT /api/v1/reports/{id}/resolve, which never existed: the router has always
  # registered them under /api/v1/admin, behind RequireAdmin.
  /api/v1/admin/hnr/rules:
    get:
      operationId: listHnRRules
      x-audience: internal
      summary: List every class's hit-and-run rule
      description: >
        A class is subject to hit-and-run tracking if and only if it has a rule
        here — a class with none (VIP, by default) is exempt, with no other
        configuration needed. Ordered by group level.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every configured rule
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/HnRRuleView'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/hnr/rules/{groupId}:
    put:
      operationId: upsertHnRRule
      x-audience: internal
      summary: Create or update a class's hit-and-run rule
      description: >
        Refuses staff groups (admin/moderator) and negative thresholds. A
        threshold of 0 is unconstrained on that dimension — a rule with both
        required_seed_hours and required_ratio at 0 has no requirement at all
        and every snatch is immediately satisfied.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The group (class) this rule applies to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                required_seed_hours:
                  type: integer
                  description: Seed-time requirement in hours; 0 = unconstrained
                required_ratio:
                  type: number
                  format: double
                  description: >
                    Ratio requirement, checked against the torrent's raw size —
                    not counted/freeleech-discounted download — so freeleech
                    torrents remain fully eligible. 0 = unconstrained.
                inactivity_grace_hours:
                  type: integer
                  description: >
                    How long a member may go without a seeding announce before
                    breaching, once the requirement above is unmet. 0 means zero
                    tolerance, not "disabled".
                max_days_to_satisfy:
                  type: integer
                  description: >
                    Hard cap from the snatch's completion, regardless of recent
                    activity. 0 = no hard cap.
      responses:
        '200':
          description: The saved rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: '#/components/schemas/HnRRule'
        '400':
          description: Invalid group ID, negative threshold, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteHnRRule
      x-audience: internal
      summary: Remove a class from hit-and-run tracking entirely
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '400':
          description: Invalid group ID, or no rule exists for this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/hnr/run:
    post:
      operationId: runHnRDaemon
      x-audience: internal
      summary: Force an immediate hit-and-run evaluation sweep
      description: >
        Goes through the same two-stage advisory lock as the scheduled hourly
        run, so it is always safe to press even while a scheduled run happens
        to be in flight — it either runs immediately or queues behind exactly
        one other run and then runs.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            The run's outcome. skipped=true means another run was already
            queued and this invocation dropped rather than waiting behind the
            queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped:
                    type: boolean
                  run_id:
                    type: integer
                    format: int64
                  scanned:
                    type: integer
                  breached:
                    type: integer
                  satisfied:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The daemon has no database handle for locking (misconfigured deployment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/hnr/runs:
    get:
      operationId: listHnRRuns
      x-audience: internal
      summary: List recent hit-and-run daemon runs, most recent first
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: The run log
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/HnRRun'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/settings:
    get:
      operationId: listSiteSettings
      x-audience: internal
      summary: List every site setting and its stored value
      description: >
        Returns each row of `site_settings`. Values are always strings; the type
        each key expects is documented on the Configure page rather than in the
        response.

        A setting the site cannot honour as stored also carries `effective_value`
        and `override_reason`. That happens when another feature requires more than
        the setting allows — today only `announce_log_retention_days`, which
        automatic class promotion holds open because it reads raw announces over
        its seeding window. Both fields are absent when the stored value is the one
        in force, so their presence is the signal.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every site setting
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      required: [key, value, updated_at]
                      properties:
                        key:
                          type: string
                          example: announce_log_retention_days
                        value:
                          type: string
                          description: The stored value, as an operator set it
                          example: '7'
                        updated_at:
                          type: string
                          format: date-time
                        effective_value:
                          type: string
                          description: >
                            The value the site acts on, present only when it differs
                            from `value`.
                          example: '31'
                        override_reason:
                          type: string
                          description: >
                            Why the stored value is not in force, and what to change
                            to make it so. Present only alongside `effective_value`.
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The settings store could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/torrents:
    get:
      operationId: adminListTorrents
      x-audience: internal
      summary: Search every torrent on the tracker (admin only)
      description: |
        Lists torrents from an administrator's view: banned, hidden and
        not-yet-approved torrents are all included, which is what distinguishes
        this from the member-facing listing.

        **Searching by info hash.** `search` is matched against torrent names,
        except when the term is exactly 40 hexadecimal characters — that cannot be
        a name, so it is matched against `info_hash` instead. This is deliberate:
        the identifier in a takedown notice or a report about a misbehaving swarm
        is a hash, and pasting it into a search box should find the torrent. Use
        the `info_hash` parameter to match by hash without relying on that guess;
        it rejects anything that is not a 40-character hex string.

        Only administrators (group_id=1) may call this.
      tags: [admin, torrents]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: >
            Torrent name (full-text, prefix-matched at 3+ characters; ILIKE at 2).
            A 40-character hex string is treated as an info hash instead.
        - name: info_hash
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{40}$'
          description: >
            Hex info hash, matched exactly and case-insensitively. Returns at most
            one torrent, since the column is unique.
        - name: name
          in: query
          schema:
            type: string
          description: >
            Forces a name search, overriding both `search`'s hash guess and any
            `info_hash` given. The inverse escape hatch: without it a torrent whose
            title happens to be 40 hex characters — a checksum, a git SHA — could
            never be found by name.
        - name: banned
          in: query
          schema:
            type: boolean
          description: >
            true lists only banned torrents, false only un-banned ones. Omit for
            both.
        - name: uploader_id
          in: query
          schema:
            type: integer
            format: int64
          description: Only torrents uploaded by this member
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: Paginated list of torrents
          content:
            application/json:
              schema:
                type: object
                properties:
                  torrents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTorrent'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                  per_page:
                    type: integer
        '400':
          description: >
            A parameter was unusable — `info_hash` not 40 hex characters, `banned`
            not a boolean, or `page`/`per_page`/`uploader_id` not a positive number.
            Rejected rather than dropped: a silently ignored filter widens the
            result set, which reads as "your search matched everything".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
