      description: >
        Returns the forum index: categories in display order, each with the forums inside it. Forums the caller's group level cannot reach are omitted, so this is already filtered to what the member may open. A category left with no readable forums is dropped from the index entirely rather than returned empty, so every category here has at least one forum in it and the index a member sees may be shorter than the one an operator configured.

      tags: [forums]
