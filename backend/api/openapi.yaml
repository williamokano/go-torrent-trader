# TorrentTrader API — FULL spec. This is the single source of truth.
#
# This file is hand-maintained and describes every endpoint, including the
# administrative ones. It is NOT the document published to third parties:
# api/openapi.public.yaml is GENERATED from this file by cmd/openapi-public
# (`task generate:openapi`) and is what the published contract consists of.
# Never edit the generated file — the change would be overwritten and, worse,
# TestPublicSpecIsUpToDate would fail rather than the edit taking effect.
#
# Every operation MUST carry `x-audience`:
#
#   x-audience: public     part of the published contract
#   x-audience: internal   deliberately withheld — admin, staff, infrastructure
#
# The marker is per-operation rather than derived from the path prefix because
# the path prefix lies: six forum topic moderation endpoints are staff-only and
# sit on ordinary /api/v1/forums/... paths, authorized in the service layer
# rather than by the router. A prefix filter would publish them.
#
# Guard tests in internal/handler/openapi_routes_test.go hold this file to the
# router: every registered route must be documented here or listed in the
# shrinking debt ledger in internal/handler/openapi_undocumented.go.
openapi: 3.0.3
info:
  title: TorrentTrader API (Full)
  version: 0.2.0
  description: >
    The complete TorrentTrader private tracker API, including the
    administrative and staff endpoints.


    This is the internal, hand-maintained source of truth — not the published
    contract. The document handed to third parties is api/openapi.public.yaml,
    generated from this one by dropping every `x-audience: internal` operation.
servers:
  - url: http://localhost:8080
    description: Development
paths:
  /healthz:
    get:
      operationId: getHealth
      # Infrastructure, not a member-facing API: this is what the container
      # orchestrator polls, and publishing it invites it to be polled by
      # everyone else too.
      x-audience: internal
      summary: Health check
      tags: [system]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /announce:
    get:
      operationId: trackerAnnounce
      x-audience: public
      summary: BitTorrent announce
      description: >
        The tracker announce endpoint, spoken by BitTorrent clients rather than
        by browsers. It is not a JSON API: the response is a bencoded
        dictionary served as text/plain, and every failure — including an
        invalid passkey — is reported as HTTP 200 with a bencoded
        `{"failure reason": "..."}` body, because that is what clients
        understand.


        Authentication is the member's 32-character hex passkey, carried in the
        query string. The passkey is baked into the announce URL of every
        .torrent file downloaded from the site, so clients send it without the
        user ever seeing it.
      tags: [tracker]
      security:
        - passkeyAuth: []
      parameters:
        - name: passkey
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
          description: The member's 32-character hex passkey
        - name: info_hash
          in: query
          required: true
          schema:
            type: string
          description: >
            The torrent's SHA1 info hash. Accepted either as the raw 20-byte
            binary value percent-encoded (what BitTorrent clients send) or as
            40 hex characters.
        - name: peer_id
          in: query
          required: true
          schema:
            type: string
          description: The client's 20-byte peer id, percent-encoded
        - name: port
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 65535
          description: The port the client is listening on
        - name: uploaded
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes uploaded this session
        - name: downloaded
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes downloaded this session
        - name: left
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes left to download
        - name: event
          in: query
          schema:
            type: string
            enum: ['', started, stopped, completed]
          description: >
            The announce event. Omitted (or empty) for a periodic announce.
      responses:
        '200':
          description: >
            A bencoded announce response, or a bencoded failure dictionary.
            Errors do not use HTTP status codes.
          content:
            text/plain:
              schema:
                type: string
                format: binary
                example: "d8:intervali1800e5:peers0:e"

  /scrape:
    get:
      operationId: trackerScrape
      x-audience: public
      summary: BitTorrent scrape
      description: >
        Swarm counts for one or more torrents, bencoded. Repeat `info_hash` to
        scrape several at once; hashes that are not 20 bytes after decoding are
        ignored rather than rejected.


        Unlike /announce this takes no passkey — it reports only aggregate
        seeder, leecher and completion counts, which say nothing about who is
        in the swarm.
      tags: [tracker]
      parameters:
        - name: info_hash
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            One or more raw 20-byte SHA1 info hashes, percent-encoded. Repeat
            the parameter to scrape multiple torrents.
      responses:
        '200':
          description: >
            A bencoded `{"files": {...}}` dictionary, or a bencoded failure
            dictionary when no usable info_hash was supplied.
          content:
            text/plain:
              schema:
                type: string
                format: binary
                example: "d5:filesdee"

  /api/v1/stats:
    get:
      operationId: getStats
      x-audience: public
      summary: Get site-wide statistics
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Site statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: '#/components/schemas/SiteStats'
        '401':
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/categories:
    get:
      operationId: getCategories
      x-audience: public
      summary: List all torrent categories
      tags: [categories]
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      operationId: authRegister
      x-audience: public
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and auto-logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      operationId: authLogin
      x-audience: public
      summary: Login with username and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      x-audience: public
      summary: Refresh access token using refresh token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      x-audience: public
      summary: Logout and invalidate current session
      description: >
        Revokes a session, identified by **either** credential.


        Send the access token as a bearer token, or `refresh_token` in the body, or
        both. The refresh token is accepted because it is the credential a client
        still holds once the access token has expired: sessions live one hour on
        their access token and thirty days on their refresh token, so requiring the
        short-lived one left a window in which a session could be used at
        `/auth/refresh` but not revoked. Possession of a refresh token already allows
        minting access tokens, so accepting it here takes capability away rather than
        granting any.


        Revoking removes both halves, so neither token works afterwards. Revoking an
        already-revoked session is not an error as long as one of the credentials sent
        was valid.
      tags: [auth]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: >
                    The session's refresh token. Use this when the access token has
                    expired, which is the case a client cannot otherwise recover from.
      responses:
        '204':
          description: Session invalidated
        '401':
          description: >
            Neither credential was usable — no valid bearer token, and no valid
            `refresh_token` in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      x-audience: public
      summary: Request a password reset link
      description: >
        Sends a password reset link to the given email if it exists.
        Always returns 200 to prevent email enumeration.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic success response (does not reveal if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      x-audience: public
      summary: Reset password using a reset token
      description: >
        Validates the reset token, sets the new password, and invalidates
        all active sessions for the user.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (password too short/long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      operationId: authMe
      x-audience: public
      summary: Get current authenticated user's full profile
      description: >
        Returns the full owner profile for the authenticated user, including
        private fields like email, masked passkey, invites, and warned status.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's full profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/OwnerProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{username}:
    get:
      operationId: getUserProfile
      x-audience: public
      summary: Get a user's profile
      description: >
        Returns a user's public profile, looked up by username. If the
        authenticated user is viewing their own profile, private fields (email,
        passkey, invites, warned, last_login) are also included.
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: The member's username
      responses:
        '200':
          description: User profile (public or owner view)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/PublicProfile'
                      - $ref: '#/components/schemas/OwnerProfile'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me/profile:
    put:
      operationId: updateProfile
      x-audience: public
      summary: Update the current user's profile
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/OwnerProfile'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me/password:
    put:
      operationId: changePassword
      x-audience: public
      summary: Change the current user's password
      description: >
        Verifies the current password, sets a new one, and invalidates all
        other sessions (keeps the current session active).
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password incorrect or not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (new password too short/long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me/passkey:
    post:
      operationId: regeneratePasskey
      x-audience: public
      summary: Regenerate the current user's passkey
      description: >
        Generates a new 32-character hex passkey. The old passkey is
        immediately invalidated.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New passkey generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkey:
                    type: string
                    description: The new 32-character hex passkey
                    example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}/announce-log:
    get:
      operationId: getUserAnnounceLog
      x-audience: public
      summary: Get a member's announce log and monthly transfer totals
      description: >
        Returns the raw announces the tracker recorded for this member, newest
        first, together with their per-month transfer totals.

        The raw rows are pruned once they pass the site's retention window, so the
        listing only reaches as far back as `retention_days` (0 means pruning is
        disabled and rows are kept indefinitely). The monthly totals are
        aggregated before the prune runs and are kept permanently, so they still
        cover months whose raw rows are gone.

        `retention_days` is the window the site actually honours, which is not
        always `announce_log_retention_days`: other features can hold the log open for
        longer, and automatic class promotion does whenever it is enabled, because
        it reads raw announces over its seeding window — 31 days at that window's
        default. Reporting the configured value here would understate how long a
        member's transfer detail is kept.

        Readable by the member themselves and by staff only: the per-announce byte
        deltas say what a member is seeding and when they are online. The tracker
        does not record announce IP addresses.
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The member's numeric ID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Announce log page and monthly totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnounceLogResponse'
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the member and not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/torrents:
    post:
      operationId: uploadTorrent
      x-audience: public
      summary: Upload a new torrent
      tags: [torrents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [torrent_file, category_id]
              properties:
                torrent_file:
                  type: string
                  format: binary
                  description: The .torrent file to upload
                category_id:
                  type: integer
                  format: int64
                  description: Category ID for the torrent
                name:
                  type: string
                  description: Display name (defaults to name from .torrent file)
                description:
                  type: string
                  description: Torrent description
                anonymous:
                  type: boolean
                  default: false
                  description: Whether to hide the uploader's identity
      responses:
        '201':
          description: Torrent uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  torrent:
                    $ref: '#/components/schemas/Torrent'
        '400':
          description: Invalid torrent file or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate torrent (info_hash already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listTorrents
      x-audience: public
      summary: Browse and search torrents
      tags: [torrents]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 2
          description: >
            Search term for torrent name. Minimum 2 characters.
            Queries with 3+ characters use PostgreSQL full-text search
            (tsvector/GIN) with relevance ranking. Queries with exactly
            2 characters fall back to case-insensitive substring matching
            (ILIKE). When full-text search is active and no explicit sort
            field is specified, results are ordered by relevance.
        - name: cat
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by category ID
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at, size, seeders, leechers]
            default: created_at
          description: Sort field
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Paginated list of torrents
          content:
            application/json:
              schema:
                type: object
                properties:
                  torrents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Torrent'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                  per_page:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/torrents/{id}:
    get:
      operationId: getTorrent
      x-audience: public
      summary: Get torrent details
      tags: [torrents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Torrent details
          content:
            application/json:
              schema:
                type: object
                properties:
                  torrent:
                    $ref: '#/components/schemas/Torrent'
        '400':
          description: Invalid torrent ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Torrent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: editTorrent
      x-audience: public
      summary: Edit torrent metadata
      description: |
        Update torrent fields. Only the torrent owner or an admin (group_id=1) may edit.
        Staff-only fields (banned, free) are rejected for non-admin users.
      tags: [torrents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTorrentRequest'
      responses:
        '200':
          description: Updated torrent
          content:
            application/json:
              schema:
                type: object
                properties:
                  torrent:
                    $ref: '#/components/schemas/Torrent'
        '400':
