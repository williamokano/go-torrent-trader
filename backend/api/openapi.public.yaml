        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/search:
    get:
      operationId: searchForumPosts
      summary: Full-text search across forum posts
      description: >
        Searches post bodies. Results are restricted to forums the caller may read, so a search cannot be used to discover the contents of a forum above the member's level.

        Each result carries `post_number` (the post's position in its topic) and the `page` that position falls on at 25 posts per page, so a client can link straight to the post rather than to the top of the topic.

        `snippet` is HTML: the matched terms are wrapped in `<mark>` tags and everything else is escaped. It is safe to render as markup and wrong to display as plain text.

      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
          description: >
            The search terms, measured in runes. A `q` that passes those bounds but reduces to no usable search terms returns an empty 200, not a 400.

        - name: forum_id
          in: query
          schema:
            type: integer
            format: int64
          description: Restrict the search to one forum
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: Matching posts, most relevant first
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumSearchResult'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                    description: >
                      The page actually served. A non-positive or unparseable `page` is resolved to 1, and this reports the resolved value, so paginating from this field is safe.

                  per_page:
                    type: integer
                    description: >
                      The page size actually used, after the cap of 100 and the default of 25 are applied — so `?per_page=500` returns 100 results and reports 100 here.

        '400':
          description: >
            `q` was absent, shorter than 2 runes, longer than 200, or `forum_id` was not a positive number

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/forums/{id}:
    get:
      operationId: getForum
      summary: Get one forum
      tags: [forums]
      security:
        - bearerAuth: []
