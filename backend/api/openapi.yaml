  /api/v1/hnr:
    get:
      operationId: listMyHnRRecords
      x-audience: public
      summary: List the authenticated member's own hit-and-run obligations
      description: >
        Breach first, then monitored, then resolved. display_status is
        evaluated live on every call — see HnRRecordView — so the page is
        never stale between the daemon's hourly runs; state is what the
        daemon last persisted and can lag display_status by up to that
        interval.
      tags: [hnr]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The member's obligations, oldest-first within each status
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
