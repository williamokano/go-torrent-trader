  /api/v1/admin/torrents/bulk:
    post:
      operationId: adminBulkTorrentAction
      x-audience: internal
      summary: Ban, unban or delete several torrents at once (admin only)
      description: |
        Applies one moderation action to up to 100 torrents.

        **Returns 200 even when some torrents failed.** Each id is handled
        independently and reported in `results`, because a list a moderator pasted
        will routinely contain one that has already been deleted, and failing the
        whole batch would leave them to work out which. The status code answers
        "was the request valid"; the body answers "what happened to each one".

        Repeated ids are collapsed. Every torrent acted on produces its own
        activity-log entry, so a bulk ban is auditable afterwards as individual
        facts rather than as one opaque batch.

        Deleting also removes each torrent's stored `.torrent` file and cannot be
        undone.
      tags: [admin, torrents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTorrentActionRequest'
      responses:
        '200':
          description: Per-torrent outcome. Check `failed` before reporting success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTorrentActionResponse'
        '400':
          description: >
            Unknown action, empty id list, or more than 100 ids — the request
            itself is unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Forbidden — administrator access required. Also returned when the
            caller is not staff at all: the check is repeated in the service layer,
            not left to the route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

