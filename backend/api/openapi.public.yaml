    description: Development
paths:
  /announce:
    get:
      operationId: trackerAnnounce
      summary: BitTorrent announce
      description: >
        The tracker announce endpoint, spoken by BitTorrent clients rather than by browsers. It is not a JSON API: the response is a bencoded dictionary served as text/plain, and every failure — including an invalid passkey — is reported as HTTP 200 with a bencoded `{"failure reason": "..."}` body, because that is what clients understand.


        Authentication is the member's 32-character hex passkey, carried in the query string. The passkey is baked into the announce URL of every .torrent file downloaded from the site, so clients send it without the user ever seeing it.

      tags: [tracker]
      security:
        - passkeyAuth: []
      parameters:
        - name: passkey
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
          description: The member's 32-character hex passkey
        - name: info_hash
          in: query
          required: true
          schema:
            type: string
          description: >
            The torrent's SHA1 info hash. Accepted either as the raw 20-byte binary value percent-encoded (what BitTorrent clients send) or as 40 hex characters.

        - name: peer_id
          in: query
          required: true
          schema:
            type: string
          description: The client's 20-byte peer id, percent-encoded
        - name: port
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 65535
          description: The port the client is listening on
        - name: uploaded
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes uploaded this session
        - name: downloaded
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes downloaded this session
        - name: left
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Bytes left to download
        - name: event
          in: query
          schema:
            type: string
            enum: ['', started, stopped, completed]
          description: >
            The announce event. Omitted (or empty) for a periodic announce.

      responses:
        '200':
          description: >
            A bencoded announce response, or a bencoded failure dictionary. Errors do not use HTTP status codes.

          content:
            text/plain:
              schema:
                type: string
                format: binary
                example: "d8:intervali1800e5:peers0:e"
  /scrape:
    get:
      operationId: trackerScrape
      summary: BitTorrent scrape
      description: >
        Swarm counts for one or more torrents, bencoded. Repeat `info_hash` to scrape several at once; hashes that are not 20 bytes after decoding are ignored rather than rejected.


        Unlike /announce this takes no passkey — it reports only aggregate seeder, leecher and completion counts, which say nothing about who is in the swarm.

      tags: [tracker]
      parameters:
        - name: info_hash
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            One or more raw 20-byte SHA1 info hashes, percent-encoded. Repeat the parameter to scrape multiple torrents.

      responses:
        '200':
          description: >
            A bencoded `{"files": {...}}` dictionary, or a bencoded failure dictionary when no usable info_hash was supplied.

          content:
            text/plain:
              schema:
                type: string
                format: binary
                example: "d5:filesdee"
