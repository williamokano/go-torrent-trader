  /api/v1/forums/{id}/topics:
    get:
      operationId: listForumTopics
      x-audience: public
      summary: List topics in a forum
      description: >
        Pinned topics first, then by most recent activity. The response repeats the
        forum itself so a client can render a header without a second request, and
        carries `can_create_topic` — posting has its own level threshold
        (`min_post_level`), which can be higher than the one needed to read.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: A page of topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  forum:
                    $ref: '#/components/schemas/Forum'
                  topics:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumTopic'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                    description: >
                      The page actually served, after a non-positive or unparseable
                      value is resolved to 1.
                  per_page:
                    type: integer
                    description: >
                      The page size actually used, after the cap of 100 and the
                      default of 25 are applied.
                  can_create_topic:
                    type: boolean
                    description: >
                      Whether the caller may open a topic here. Answers the same
                      question the create call does: the group level must reach the
                      forum's `min_post_level` **and** the member's own forum
                      privilege must not be revoked. False for an anonymous caller.
        '400':
          description: Invalid forum ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Forum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createForumTopic
      x-audience: public
      summary: Start a topic
      description: >
        Creates the topic and its first post in one call, and returns both. The
        first post cannot be deleted on its own — deleting the topic is what removes
        it.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForumTopicRequest'
      responses:
        '201':
          description: >
            The new topic and its first post, re-read after the insert so both carry
            the same fully populated shape any other endpoint returns — the byline
            fields (`username`, `forum_name`, `group_name`, `avatar`,
            `user_created_at`, `user_post_count`) are set, and `is_first_post` is
            `true` on the post that opens the topic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    $ref: '#/components/schemas/ForumTopic'
                  post:
                    $ref: '#/components/schemas/ForumPost'
        '400':
          description: >
            Invalid forum ID, unparseable body, an empty title or body, or a title
            longer than 200 runes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller's group level is below the forum's `min_post_level`, they
            cannot read the forum at all, or their forum privilege has been revoked
            (`can_forum`) — the last of these is the common case in practice and is
            not reflected in `can_create_topic`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Forum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/topics/{id}:
    get:
      operationId: getForumTopic
      x-audience: public
      summary: Get a topic and a page of its posts
      description: >
        Reading a topic increments its view count.

        Soft-deleted posts are still returned, with `is_deleted` true — a gap in the
        numbering would be more confusing than a placeholder. Their `body` and
        `mentioned_usernames` are blanked for anyone but staff, so a deleted post
        cannot be read through this endpoint by the member it was hidden from.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: The topic and one page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    $ref: '#/components/schemas/ForumTopic'
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumPost'
                  total:
                    type: integer
                    format: int64
                  page:
                    type: integer
                    description: >
                      The page actually served, after a non-positive or unparseable
                      value is resolved to 1.
                  per_page:
                    type: integer
                    description: >
                      The page size actually used, after the cap of 100 and the
                      default of 25 are applied.
                  can_moderate:
                    type: boolean
                    description: >
                      True for staff who also pass the moderation hierarchy check —
                      so it is not simply "is staff", and is false for a staff member
                      outranked by the topic's author — and true for the topic's own
                      author within the 30-minute grace period after creating it.

                      It is **not** a single permission. An author who holds it by
                      the grace period may lock and delete but not pin, unpin or
                      move, which are staff-only regardless. Renaming is separate
                      again: the author may rename their own topic with no time
                      limit, so `can_moderate: false` does not mean rename is
                      refused. Tracked in #235.
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The topic's forum is above the caller's group level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteForumTopic
      x-audience: public
      summary: Delete a topic and every post in it
      description: >
        Published rather than internal because the author may delete their own topic
        within 30 minutes of creating it — a typo in a new thread does not need staff.
        After that window it is staff-only, and a staff member cannot delete a topic
        started by someone who outranks them.

        The optional `reason` is recorded in the activity log.
      tags: [forums]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumModerationReason'
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid topic ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not the author inside the grace period, not staff, or staff outranked by
            the topic's author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forums/topics/{id}/posts:
    post:
      operationId: createForumPost
      x-audience: public
