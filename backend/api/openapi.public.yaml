  /api/v1/hnr:
    get:
      operationId: listMyHnRRecords
      summary: List the authenticated member's own hit-and-run obligations
      description: >
        Breach first, then monitored, then resolved. display_status is evaluated live on every call — see HnRRecordView — so the page is never stale between the daemon's hourly runs; state is what the daemon last persisted and can lag display_status by up to that interval.

      tags: [hnr]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The member's obligations, oldest-first within each status
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/HnRRecordView'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hnr/{id}/clear-price:
    get:
      operationId: quoteHnRClear
      summary: Price clearing one obligation with bonus points, without spending
      description: >
        What POST .../clear would charge right now, computed the same way — server-side, from the site's hnr_clear_pricing_mode — so the member page can quote a price before the member commits.

      tags: [hnr]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The current price, in bonus points
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: integer
                    format: int64
        '400':
          description: Invalid record ID, or the record is not open (already resolved) or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hnr/{id}/clear:
    post:
      operationId: clearHnRRecord
      summary: Pay off one open hit-and-run obligation with bonus points
      description: >
        The price is always computed server-side, freshly, inside the same request the points are spent in — the request body carries nothing to trust. The spend is race-safe against the balance (mirrors the bonus store's purchase flow). On success the penalty ladder is re-evaluated for the member immediately, so a restriction the clear paid off lifts in this response rather than waiting for the next daemon run.

      tags: [hnr]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: integer
                    format: int64
                  new_balance:
                    type: integer
                    format: int64
        '400':
          description: Invalid record ID, or the record is not open or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Insufficient bonus points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hnr/clear-all:
    post:
      operationId: clearAllHnRRecords
      summary: Clear every open obligation the member can currently afford
      description: >
        Cheapest first, stopping the moment the balance can't cover the next one. A partial clear is a 200, not an error — everything affordable got cleared, and stopped_insufficient_points says whether the balance ran out before the rest. Each record is priced and spent through the exact same path as POST .../clear, called in a loop — never a separately-computed total.

      tags: [hnr]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sweep's outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: How many obligations were cleared.
                  total_spent:
                    type: integer
                    format: int64
                  new_balance:
                    type: integer
                    format: int64
                  stopped_insufficient_points:
                    type: boolean
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
