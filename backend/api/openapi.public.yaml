          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The .torrent file
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid torrent ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — the download capability is not held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Torrent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rss:
    get:
      operationId: getRSSFeed
      summary: RSS feed of the newest torrents
      description: >
        An RSS 2.0 feed of the most recently uploaded torrents, authenticated by passkey rather than by bearer token so that feed readers and automation can subscribe to a plain URL.


        KNOWN LIMITATION — the `<enclosure url="...">` of each item points at `/api/v1/torrents/{id}/download?passkey=...`, but that endpoint does not accept a passkey: it requires a bearer token and the `download` capability. Following an enclosure URL therefore returns 401 unless the client is already carrying a session. Use the enclosure only to identify the torrent, and fetch the .torrent file with an authenticated request.

      tags: [torrents, rss]
      security:
        - passkeyAuth: []
      parameters:
        - name: passkey
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
          description: The member's 32-character hex passkey
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: >
            How many torrents to include. Values above 100 are clamped to 100; values that are not a positive integer fall back to the default.

        - name: cat
          in: query
          schema:
            type: integer
            format: int64
          description: Restrict the feed to a single category ID
      responses:
        '200':
          description: RSS 2.0 feed
          content:
            application/rss+xml:
              schema:
                type: string
        '401':
          description: Missing or invalid passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/announce-stream:
    get:
      operationId: announceStreamDefault
      summary: Live announcement stream (default feed)
      description: >
        Server-sent events carrying new-torrent announcements as they happen, for the default feed. Equivalent to GET /api/v1/announce-stream/{slug} with the default slug; it predates multiple feeds and is kept so an already-open page reconnects rather than failing forever.

      tags: [feeds]
      parameters:
        - $ref: '#/components/parameters/StreamToken'
      responses:
        '200':
          $ref: '#/components/responses/AnnounceStream'
        '401':
          $ref: '#/components/responses/StreamUnauthorized'
        '403':
          $ref: '#/components/responses/StreamForbidden'
        '429':
          $ref: '#/components/responses/StreamTooMany'
  /api/v1/announce-stream/{slug}:
    get:
      operationId: announceStream
      summary: Live announcement stream
      description: >
        Server-sent events carrying new-torrent announcements for one feed, as they happen. Each frame is an `announcement` event whose data is the rendered announcement; comment lines are sent periodically as heartbeats.


        Authentication is a `token` query parameter holding an access token, because EventSource cannot set an Authorization header. Access additionally requires the `can_feed` privilege, checked live on every connect, so a revoked privilege bites at the next reconnect. A member may hold a limited number of concurrent streams across all feeds; past that the connection is refused with 429.


        An unrecognised but well-formed slug opens a stream that simply stays quiet — feeds are admin-configurable and the hub does not race their edits.

      tags: [feeds]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: The feed's slug, as listed by GET /api/v1/announce-feeds
        - $ref: '#/components/parameters/StreamToken'
      responses:
        '200':
          $ref: '#/components/responses/AnnounceStream'
        '401':
          $ref: '#/components/responses/StreamUnauthorized'
        '403':
          $ref: '#/components/responses/StreamForbidden'
        '404':
          description: Malformed feed slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/StreamTooMany'
  /api/v1/torrents/{id}/moderation/approve:
    post:
      operationId: approveTorrent
      summary: Approve a torrent awaiting moderation
      description: >
        Approves a torrent in the moderation queue. Authorization happens in the service layer: staff may approve any pending torrent, and an uploader holding the self-approve privilege may approve their own.

      tags: [torrents, moderation]
      security:
        - bearerAuth: []
