# Mirrors backend/.golangci.yml so both Go modules are held to the same bar.
version: "2"

run:
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

# Enforced by the same `golangci-lint run` the lint job already executes, so
# unformatted code fails CI instead of accumulating silently.
formatters:
  enable:
    - gofmt
