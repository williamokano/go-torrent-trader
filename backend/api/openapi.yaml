          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteTorrent
      x-audience: public
      summary: Delete a torrent
      description: |
        Delete a torrent and its stored .torrent file.
        Only the torrent owner or an admin (group_id=1) may delete.
        A reason is required.
      tags: [torrents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
