# TorrentTrader -> go-torrent-trader column mapping.

# Generated by `migrate mapping` from localhost:3306/torrenttrader.
# This is a proposal, not a decision. Read it, edit it, and keep it in version
# control — the migration is driven from this file once `migrate run` exists.

# `type` is the column's type in the source database, recorded so this file can
# be reviewed without connecting to it. A `charset` line means the column is not
# stored as Unicode and its text has to be converted, not copied.

# action:
#   map     copy this column to the target column, through `transform` if set
#   derive  the value reaches the target another way; `target` says where
#   skip    deliberately not migrated; the comment says why
#   custom  a mod added this column and only you know what it is for
#   review  a stock column this tool has no rule for yet

# Every `custom` and `review` entry needs a decision before the run.
version: 1
# Where this file was generated from.
source:
    database: torrenttrader
    server: localhost:3306/torrenttrader
# One entry per table found in the source database.
tables:
    # Not part of TorrentTrader 3.0 — a mod, or another application sharing this database. Decide where it goes, or set action to skip.
    bonus_log:
        action: review
        columns:
            id:
                type: int unsigned
                action: custom
            userid:
                type: int unsigned
                action: custom
            amount:
                type: float
                action: custom
    # Hierarchical categories flatten onto categories.parent_id.

    # The target seeds 20 categories at explicit ids 1-20. Keeping legacy ids collides with them, so either merge onto the seeded rows or renumber and rewrite torrents.category_id to match. Reset the id sequence afterwards.
    # No column rules yet — give every column below a target, or skip it.
    categories:
        action: migrate
        target: categories
        columns:
            id:
                type: int unsigned
                action: review
            name:
                type: varchar(50)
                charset: latin1
                action: review
            parent_cat:
                type: varchar(50)
                charset: latin1
                action: review
            image:
                type: varchar(100)
                charset: latin1
                action: review
            sort:
                type: int
                action: review
    # Legacy comments cover torrents and news; only the torrent rows have a home here. News comments have no target table.
    # No column rules yet — give every column below a target, or skip it.
    comments:
        action: migrate
        target: torrent_comments
        columns:
            id:
                type: int unsigned
                action: review
            torrent:
                type: int unsigned
                action: review
            news:
                type: int unsigned
                action: review
            user:
                type: int unsigned
                action: review
            added:
                type: datetime
                action: review
            text:
                type: text
                charset: latin1
                action: review
    # The legacy completion log becomes the target's transfer history. Legacy keeps no per-torrent byte counts, so the totals start at zero — members keep their overall ratio from users.uploaded and users.downloaded, not from these rows.

    # Both sides are unique on (member, torrent), so the rows transfer one for one. What does not transfer is a row whose member or torrent no longer exists: the target has real foreign keys where the legacy MyISAM schema had none, so orphaned rows have to be dropped rather than inserted.
    completed:
        action: migrate
        target: transfer_history
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            userid:
                type: int
                action: map
                target: user_id
            torrentid:
                type: int
                action: map
                target: torrent_id
            date:
                type: datetime
                action: map
                target: completed_at
        # Target columns filled from something other than a single legacy column.
        derived:
            downloaded: 0 — see uploaded
            last_announce: date
            seeder: false
            uploaded: 0 — the legacy schema records no per-torrent totals
    # The target keeps the file list as JSONB on the torrent, so these rows are grouped by torrent rather than inserted one for one.
    # No column rules yet — give every column below a target, or skip it.
    files:
        action: migrate
        target: torrents.files
        columns:
            id:
                type: int unsigned
                action: review
            torrent:
                type: int unsigned
                action: review
            filename:
                type: varchar(255)
                charset: latin1
                action: review
            size:
                type: bigint unsigned
                action: review
    # Read and write levels both carry across: minclassread becomes min_group_level and minclasswrite becomes min_post_level.
    forum_forums:
        action: migrate
        target: forums
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            name:
                type: varchar(60)
                charset: latin1
                action: map
                target: name
            description:
                type: varchar(200)
                charset: latin1
                action: map
                target: description
            # Resolved through the forumcats mapping.
            category:
                type: tinyint
                action: map
                target: category_id
            sort:
                type: tinyint unsigned
                action: map
                target: sort_order
            minclassread:
                type: tinyint unsigned
                action: map
                target: min_group_level
            # The target gates starting a topic on this level. It does not gate replies, so a forum that was read-only to most members needs checking by hand.
            minclasswrite:
                type: tinyint unsigned
                action: map
                target: min_post_level
            # The target has no guest access to forums.
            guest_read:
                type: enum('yes','no')
                charset: latin1
                action: skip
        # Target columns filled from something other than a single legacy column.
        derived:
            created_at: the run time — the legacy schema records no creation date for a forum
            last_post_id: the newest migrated post in the forum
            post_count: counted from the migrated posts
            topic_count: counted from the migrated topics
            updated_at: the run time
    forum_posts:
        action: migrate
        target: forum_posts
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            topicid:
                type: int unsigned
                action: map
                target: topic_id
            userid:
                type: int unsigned
                action: map
                target: user_id
            added:
                type: datetime
                action: map
                target: created_at
            body:
                type: longtext
                charset: latin1
                action: map
                target: body
                transform: bbcode_to_markdown
            editedby:
                type: int unsigned
                action: map
                target: edited_by
            editedat:
                type: datetime
                action: map
                target: edited_at
        # Target columns filled from something other than a single legacy column.
        derived:
            deleted_at: NULL — the legacy forum deletes posts outright, so nothing is soft-deleted on arrival
            deleted_by: NULL — see deleted_at
            mentioned_usernames: empty — the target populates this when a post is written
            reply_to_post_id: NULL — legacy posts are a flat list with no reply threading
            search_vector: maintained by the backend
            updated_at: editedat where the post was edited, otherwise added
    forum_topics:
        action: migrate
        target: forum_topics
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            forumid:
                type: int unsigned
                action: map
                target: forum_id
            userid:
                type: int unsigned
                action: map
                target: user_id
            subject:
                type: varchar(40)
                charset: latin1
                action: map
                target: title
            locked:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: locked
                transform: yes_no_to_bool
            sticky:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: pinned
                transform: yes_no_to_bool
            # Moved-topic tombstones have no target representation.
            moved:
                type: enum('yes','no')
                charset: latin1
                action: skip
            views:
                type: int
                action: map
                target: view_count
            lastpost:
                type: int unsigned
                action: map
                target: last_post_id
        # Target columns filled from something other than a single legacy column.
        derived:
            created_at: the added date of the topic's first post — legacy topics carry no timestamp of their own
            last_post_at: the created_at of the post last_post_id points to
            last_post_by: the author of the post last_post_id points to
            post_count: counted from the migrated posts
            search_vector: maintained by the backend
            updated_at: last_post_at
    # The target seeds 3 forum categories. Merge onto them or insert alongside, then reset the id sequence.
    # No column rules yet — give every column below a target, or skip it.
    forumcats:
        action: migrate
        target: forum_categories
        columns:
            id:
                type: int unsigned
                action: review
            name:
                type: varchar(60)
                charset: latin1
                action: review
            sort:
                type: tinyint unsigned
                action: review
    # The legacy permission flags are finer-grained than the target's. Several collapse onto is_moderator and is_admin, which loses detail — check the result against your staff roster before going live.

    # The target seeds this table with 6 groups whose name and slug are UNIQUE, so legacy ids and names collide. Decide per group whether to merge into the seeded row or insert alongside it, and reset the id sequence afterwards.
    groups:
        action: migrate
        target: groups
        columns:
            # Kept: users.class refers to it.
            group_id:
                type: int
                action: map
                target: id
            # The display name, copied as-is. groups.slug is slugified from it.
            level:
                type: varchar(50)
                charset: latin1
                action: map
                target: name
            # Every member can browse in the target.
            view_torrents:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # Folded into is_moderator with the other moderation flags.
            edit_torrents:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            # See edit_torrents.
            delete_torrents:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            # Every member can view profiles in the target.
            view_users:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # See edit_torrents.
            edit_users:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            # Deleting members is an admin power in the target.
            delete_users:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_admin
            # Every member can read news in the target.
            view_news:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # See edit_torrents.
            edit_news:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            # See edit_torrents.
            delete_news:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            can_upload:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: can_upload
                transform: yes_no_to_bool
            can_download:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: can_download
                transform: yes_no_to_bool
            # Forum read access is governed by forums.min_group_level in the target.
            view_forum:
                type: enum('yes','no')
                charset: latin1
                action: skip
            edit_forum:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: can_forum
                transform: yes_no_to_bool
            # See edit_torrents.
            delete_forum:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            control_panel:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: is_admin
                transform: yes_no_to_bool
            # See edit_torrents.
            staff_page:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: is_moderator
            # Staff-page visibility has no target column.
            staff_public:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # Display ordering of the staff page.
            staff_sort:
                type: tinyint unsigned
                action: skip
        # Target columns filled from something other than a single legacy column.
        derived:
            can_comment: true — TorrentTrader has no separate comment permission
            can_feed: true — no legacy equivalent
            can_invite: true — invites are governed per member in the legacy schema
            can_self_approve: false — a new permission with no legacy counterpart; grant it deliberately
            color: NULL — legacy groups have no colour
            created_at: the run time
            is_immune: false — set this by hand for the staff groups that should not be ratio-watched
            level: the legacy group_id, which is also the class rank users.class refers to
            slug: slugified from level
            updated_at: the run time
    # Only the rows a member actually sent or received. Drafts and templates go to saved_messages instead — see the note on location.
    messages:
        action: migrate
        target: messages
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            sender:
                type: int unsigned
                action: map
                target: sender_id
            receiver:
                type: int unsigned
                action: map
                target: receiver_id
            added:
                type: datetime
                action: map
                target: created_at
            # Legacy TEXT against a target varchar(255); longer subjects are truncated.
            subject:
                type: text
                charset: latin1
                action: map
                target: subject
            msg:
                type: text
                charset: latin1
                action: map
                target: body
                transform: bbcode_to_markdown
            # Reversed sense: unread='yes' becomes is_read=false.
            unread:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: is_read
                transform: yes_no_to_bool_inverted
            # Legacy thread id; the target threads messages through parent_id, which the legacy data cannot reconstruct.
            poster:
                type: bigint unsigned
                action: skip
            # The legacy mailbox enum encodes which side deleted the message: 'in' means the sender deleted it, 'out' means the receiver did, 'both' means neither — see FULL_FEATURE_DOCUMENTATION.md section 8.5 before 'correcting' this. Rows marked 'draft' or 'template' are not messages at all: they belong in saved_messages, whose kind column takes exactly those two values.
            location:
                type: enum('in','out','both','draft','template')
                charset: latin1
                action: derive
                target: sender_deleted, receiver_deleted
        # Target columns filled from something other than a single legacy column.
        derived:
            mentioned_usernames: empty — the target populates this when a message is written
            parent_id: NULL — the legacy poster column is a thread id, which cannot be resolved back to the single parent the target threads on
    # Peers are live tracker state with a short life. Migrating them keeps swarms intact across the cutover; skipping the table costs a few minutes of empty peer lists and nothing else.
    peers:
        action: migrate
        target: peers
        columns:
            id:
                type: int unsigned
                action: map
                target: id
            torrent:
                type: int unsigned
                action: map
                target: torrent_id
            # The target stores the peer id as bytes.
            peer_id:
                type: varchar(40)
                charset: latin1
                action: map
                target: peer_id
                transform: text_to_bytea
            # peers.ip is NOT NULL in the target, so a row with an unparseable address is dropped rather than nulled.
            ip:
                type: varchar(64)
                charset: latin1
                action: map
                target: ip
                transform: text_to_inet
            port:
                type: smallint unsigned
                action: map
                target: port
            uploaded:
                type: bigint unsigned
                action: map
                target: uploaded
            downloaded:
                type: bigint unsigned
                action: map
                target: downloaded
            to_go:
                type: bigint unsigned
                action: map
                target: left_bytes
            seeder:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: seeder
                transform: yes_no_to_bool
            started:
                type: datetime
                action: map
                target: started_at
            last_action:
                type: datetime
                action: map
                target: last_announce
            # Connectability checking was not ported.
            connectable:
                type: enum('yes','no')
                charset: latin1
                action: skip
            client:
                type: varchar(60)
                charset: latin1
                action: map
                target: agent
            # Legacy stores this as a varchar; the target column is a bigint.
            userid:
                type: varchar(32)
                charset: latin1
                action: map
                target: user_id
            # Redundant: the member is already identified by user_id.
            passkey:
                type: varchar(32)
                charset: latin1
                action: skip
    # No column rules yet — give every column below a target, or skip it.
    shoutbox:
        action: migrate
        target: chat_messages
        columns:
            id:
                type: int unsigned
                action: review
            userid:
                type: int unsigned
                action: review
            date:
                type: int
                action: review
            text:
                type: text
                charset: latin1
                action: review
    # info_hash is the one column that cannot be got wrong: the target stores the 20 raw bytes where the legacy schema stores 40 hex characters, and a torrent whose hash does not survive stops announcing.
    torrents:
        action: migrate
        target: torrents
        columns:
            # Kept: peers, comments and completions all refer to it.
            id:
                type: int unsigned
                action: map
                target: id
            # 40 hex characters become the 20 bytes the tracker compares against. A row whose hash is not 40 valid hex characters must stop the run, not be skipped.
            info_hash:
                type: varchar(40)
                charset: latin1
                action: map
                target: info_hash
                transform: hex_to_bytea
            name:
                type: varchar(255)
                charset: latin1
                action: map
                target: name
            # The .torrent file itself moves to object storage; the row keeps no filename.
            filename:
                type: varchar(255)
                charset: latin1
                action: derive
                target: object storage
            # No target column.
            save_as:
                type: varchar(255)
                charset: latin1
                action: skip
            descr:
                type: text
                charset: latin1
                action: map
                target: description
                transform: bbcode_to_markdown
            # Custom images go into the torrents.metadata JSONB document.
            image1:
                type: text
                charset: latin1
                action: derive
                target: metadata
            # See image1.
            image2:
                type: text
                charset: latin1
                action: derive
                target: metadata
            # Resolved through the categories mapping, which must run first.
            category:
                type: int unsigned
                action: map
                target: category_id
            # No target column for torrent language.
            torrentlang:
                type: int unsigned
                action: skip
            size:
                type: bigint unsigned
                action: map
                target: size
            added:
                type: datetime
                action: map
                target: created_at
            # single/multi is implied by file_count in the target.
            type:
                type: enum('single','multi')
                charset: latin1
                action: skip
            numfiles:
                type: int unsigned
                action: map
                target: file_count
            owner:
                type: int unsigned
                action: map
                target: uploader_id
            anon:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: anonymous
                transform: yes_no_to_bool
            # Denormalised count. Worth recomputing after the comments migration rather than trusting the legacy value.
            comments:
                type: int unsigned
                action: map
                target: comments_count
            # Detail-page view counter has no target column.
            views:
                type: int unsigned
                action: skip
            # Download-link counter has no target column.
            hits:
                type: int unsigned
                action: skip
            times_completed:
                type: int unsigned
                action: map
                target: times_completed
            # Recomputed by the tracker on the first announce; copied so the listing is not empty in the meantime.
            seeders:
                type: int unsigned
                action: map
                target: seeders
            # See seeders.
            leechers:
                type: int unsigned
                action: map
                target: leechers
            # Recomputed from the migrated rating rows.
            numratings:
                type: int unsigned
                action: derive
                target: torrent_ratings
            # See numratings.
            ratingsum:
                type: int unsigned
                action: derive
                target: torrent_ratings
            visible:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: visible
                transform: yes_no_to_bool
            banned:
                type: enum('yes','no')
                charset: latin1
                action: map
                target: banned
                transform: yes_no_to_bool
            # Legacy stores a yes/no flag and keeps the NFO in a file; the target stores the text. The flag says which torrents have a file to read.
            nfo:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: nfo
            # The new tracker issues its own announce URL.
            announce:
                type: varchar(255)
                charset: latin1
                action: skip
            # External-tracker flag has no target column.
            external:
                type: enum('yes','no')
                charset: latin1
                action: skip
            freeleech:
                type: enum('0','1')
                charset: latin1
                action: map
                target: free
                transform: zero_one_to_bool
            last_action:
                type: datetime
                action: map
                target: updated_at
        # Target columns filled from something other than a single legacy column.
        derived:
            approved_at: created_at for a visible torrent — anything already live on the old site counts as approved
            approved_by: NULL — the legacy schema records no approver
            assigned_moderator_id: NULL — nothing arrives in a moderation queue
            files: the legacy files table, grouped by torrent into one JSONB document
            moderation_status: approved for a visible torrent, rejected for a banned one
            search_vector: maintained by the backend; leave it to the trigger rather than writing it
            silver: false — no legacy equivalent
    # Members keep their id and passkey, so existing .torrent files keep announcing and every foreign key in the dump resolves without a translation table.
    users:
        action: migrate
        target: users
        columns:
            # Kept, so foreign keys across the dump resolve without a translation table.
            id:
                type: int unsigned
                action: map
                target: id
            # Legacy varchar(40) against a target varchar(20). Names longer than 20 characters have to be shortened before the run — nothing checks this yet, so find them with SELECT username FROM users WHERE CHAR_LENGTH(username) > 20.
            username:
                type: varchar(40)
                charset: latin1
                action: map
                target: username
            # Carried across as-is. The backend verifies the legacy scheme once and re-hashes to argon2id, so nobody is asked to reset a password.
            password:
                type: varchar(40)
                charset: latin1
                action: map
                target: password_hash
                transform: legacy_hash
            # Legacy session token. Sessions are re-established at first login.
            secret:
                type: varchar(20)
                charset: latin1
                action: skip
            # Email-change token; the new flow issues its own.
            editsecret:
                type: varchar(20)
                charset: latin1
                action: skip
            email:
                type: varchar(80)
                charset: latin1
                action: map
                target: email
            # ENUM('pending','confirmed') becomes a timestamp: confirmed accounts take their registration date, pending accounts stay NULL.
            status:
                type: enum('pending','confirmed')
                charset: latin1
                action: derive
                target: activated_at
            enabled:
                type: varchar(10)
                charset: latin1
                action: map
                target: enabled
                transform: yes_no_to_bool
            added:
                type: datetime
                action: map
                target: created_at
            last_login:
                type: datetime
                action: map
                target: last_login
            last_access:
                type: datetime
                action: map
                target: last_access
            # Last-browse timestamp has no target column.
            last_browse:
                type: int
                action: skip
            # An address the target's INET type rejects lands as NULL rather than failing the batch.
            ip:
                type: varchar(39)
                charset: latin1
                action: map
                target: ip
                transform: text_to_inet
            # Resolved through the groups mapping, which must run first.
            class:
                type: tinyint unsigned
                action: map
                target: group_id
                transform: class_to_group_id
            # Profile visibility has no target setting.
            privacy:
                type: enum('strong','normal','low')
                charset: latin1
                action: skip
            # Per-user stylesheet; theming is client-side now.
            stylesheet:
                type: int
                action: skip
            # UI language has no target column on the member record.
            language:
                type: varchar(20)
                charset: latin1
                action: skip
            uploaded:
                type: bigint unsigned
                action: map
                target: uploaded
            downloaded:
                type: bigint unsigned
                action: map
                target: downloaded
            # Must survive the cutover: every .torrent file already downloaded announces with this key.
            passkey:
                type: varchar(32)
                charset: latin1
                action: map
                target: passkey
            avatar:
                type: varchar(100)
                charset: latin1
                action: map
                target: avatar
            title:
                type: varchar(30)
                charset: latin1
                action: map
                target: title
            # Forum signatures have no target column.
            signature:
                type: varchar(200)
                charset: latin1
                action: skip
            info:
                type: text
                charset: latin1
                action: map
                target: info
            # The target keeps a countries table but does not put a country on the member record.
            country:
                type: int unsigned
                action: skip
            # No target column.
            gender:
                type: varchar(6)
                charset: latin1
                action: skip
            # No target column.
            age:
                type: int
                action: skip
            # Preferred-client preference has no target column.
            client:
                type: varchar(25)
                charset: latin1
                action: skip
            # Legacy stores an amount; the target records only whether the member donated, so any non-zero amount becomes true.
            donated:
                type: int unsigned
                action: map
                target: donor
                transform: positive_to_bool
            warned:
                type: char(3)
                charset: latin1
                action: map
                target: warned
                transform: yes_no_to_bool
            # Reversed sense: forumbanned='yes' becomes can_forum=false.
            forumbanned:
                type: char(3)
                charset: latin1
                action: map
                target: can_forum
                transform: yes_no_to_bool_inverted
            # Staff notes become one mod_notes row per member rather than a column.
            modcomment:
                type: text
                charset: latin1
                action: derive
                target: mod_notes
            # No target setting for refusing private messages.
            acceptpms:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # Becomes a notification preference row; the exact shape is settled by the social-data migration.
            commentpm:
                type: enum('yes','no')
                charset: latin1
                action: derive
                target: notification_preferences
            # Legacy packed preference string, superseded by notification_preferences.
            notifs:
                type: varchar(100)
                charset: latin1
                action: derive
                target: notification_preferences
            invited_by:
                type: int
                action: map
                target: invited_by
            # Space-separated ids, redundant with invited_by. Read only as a cross-check that the two agree.
            invitees:
                type: varchar(100)
                charset: latin1
                action: derive
                target: users.invited_by
            invites:
                type: smallint
                action: map
                target: invites
            # No target column.
            invitedate:
                type: datetime
                action: skip
            # Teams are not in the target schema yet.
            team:
                type: int unsigned
                action: skip
            # Timezones are handled in the browser.
            tzoffset:
                type: int
                action: skip
            # Client-side preference in the new UI.
            hideshoutbox:
                type: enum('yes','no')
                charset: latin1
                action: skip
            # Who's-online scratch state.
            page:
                type: text
                charset: latin1
                action: skip
            seedbonus:
                type: float
                action: custom
            karma:
                type: int
                action: custom
        # Target columns filled from something other than a single legacy column.
        derived:
            bonus_points: 0 — TorrentTrader 3.0 has no bonus economy
            can_chat: true — no legacy per-member equivalent
            can_download: true — see can_upload
            can_feed: true — no legacy per-member equivalent
            can_invite: true — see can_upload
            can_upload: true — the legacy schema grants this by class, not per member, and groups.can_upload already carries it
            disabled_until: NULL — legacy enabled is permanent, not timed
            parked: false
            password_scheme: the scheme the legacy hash is in, so the backend can verify it once and re-hash to argon2id at next login
            updated_at: added, the registration date — the legacy schema records no modification time
            warn_until: NULL — legacy warnings are a flag with no expiry, so a warned member stays warned until staff clear it
