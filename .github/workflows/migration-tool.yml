name: Migration Tool CI
# backend/migrations is in the trigger paths on purpose. The tool declares the
# target schema itself — Shared Nothing forbids importing the backend's — and a
# test checks that declaration against the migrations applied to a real
# PostgreSQL. Without this path, a backend schema change could not fail the
# check that exists to catch it, which is the same as not having the check.
on:
  push:
    branches: [main]
    paths:
      - 'migration-tool/**'
      - 'backend/migrations/**'
      - '.github/workflows/migration-tool.yml'
  pull_request:
    branches: [main]
    paths:
      - 'migration-tool/**'
      - 'backend/migrations/**'
      - '.github/workflows/migration-tool.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: migration-tool/go.sum
      - run: go vet ./...
        working-directory: migration-tool

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: migration-tool/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
        working-directory: migration-tool

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: migration-tool/go.sum
      - run: go build -o migrate ./cmd/migrate
        working-directory: migration-tool
